<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Early gastric cancer artificial intelligence modelling workflow</title>
  <desc id="description">Controlled clinical data and endoscopic images feed four model families. Their outputs are evaluated for lymph node metastasis and invasion depth prediction.</desc>
  <!-- Version 4: modelling tasks only, with balanced outer margins and larger type. -->

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D99A16"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#278A58"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-lnm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/>
    </marker>
    <marker id="arrow-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2415A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <style>
      .heading { font: 700 26px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0.2px; }
      .box-label { font: 700 21px Arial, Helvetica, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .rail { fill: none; stroke-width: 3; stroke-linecap: round; }
      .node { filter: url(#shadow); }
      @media (prefers-color-scheme: dark) {
        .heading { fill: #E2E8F0; }
      }
    </style>
  </defs>

  <!-- Column headings -->
  <text class="heading" x="145" y="38" text-anchor="middle">Study inputs</text>
  <text class="heading" x="550" y="38" text-anchor="middle">Model families</text>
  <text class="heading" x="1040" y="38" text-anchor="middle">Prediction tasks</text>

  <!-- Input-to-model connectors: shared rails with rounded exits -->
  <path class="rail" d="M 260 160 H 315 M 315 120 V 440" stroke="#2563EB"/>
  <path class="connector" d="M 315 120 Q 315 100 335 100 H 430" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 315 200 Q 315 220 335 220 H 430" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 315 320 Q 315 340 335 340 H 430" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 315 440 Q 315 460 335 460 H 430" stroke="#2563EB" marker-end="url(#arrow-blue)"/>

  <path class="rail" d="M 260 440 H 365 M 365 380 V 460" stroke="#0F766E"/>
  <path class="connector" d="M 365 380 Q 365 360 385 360 H 430" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <path class="connector" d="M 365 460 Q 365 480 385 480 H 430" stroke="#0F766E" marker-end="url(#arrow-teal)"/>

  <!-- Model-output collector: straight model lines feeding one shared rail -->
  <path class="connector" d="M 670 100 H 790" stroke="#D99A16" marker-end="url(#arrow-gold)"/>
  <path class="connector" d="M 670 220 H 790" stroke="#278A58" marker-end="url(#arrow-green)"/>
  <path class="connector" d="M 670 340 H 790" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M 670 460 H 790" stroke="#7C3AED" marker-end="url(#arrow-purple)"/>
  <path class="rail" d="M 790 100 V 460" stroke="#64748B"/>

  <!-- Rounded task branches: distinct colours for LNM and invasion depth -->
  <path class="connector" d="M 790 300 V 215 Q 790 185 820 185 H 910" stroke="#0E7490" marker-end="url(#arrow-lnm)"/>
  <path class="connector" d="M 790 300 V 355 Q 790 385 820 385 H 910" stroke="#C2415A" marker-end="url(#arrow-depth)"/>

  <!-- Input nodes -->
  <rect class="node" x="30" y="120" width="230" height="80" rx="18" fill="#2563EB" stroke="#1E3A8A" stroke-width="2"/>
  <text class="box-label" x="145" y="151">
    <tspan x="145" dy="0">Controlled</tspan>
    <tspan x="145" dy="27">clinical data</tspan>
  </text>

  <rect class="node" x="30" y="400" width="230" height="80" rx="18" fill="#0F766E" stroke="#134E4A" stroke-width="2"/>
  <text class="box-label" x="145" y="431">
    <tspan x="145" dy="0">Endoscopic</tspan>
    <tspan x="145" dy="27">images</tspan>
  </text>

  <!-- Model nodes -->
  <rect class="node" x="430" y="60" width="240" height="80" rx="18" fill="#D99A16" stroke="#8B5E00" stroke-width="2"/>
  <text class="box-label" x="550" y="106">Logistic regression</text>

  <rect class="node" x="430" y="180" width="240" height="80" rx="18" fill="#278A58" stroke="#166534" stroke-width="2"/>
  <text class="box-label" x="550" y="226">LightGBM</text>

  <rect class="node" x="430" y="300" width="240" height="80" rx="18" fill="#EA580C" stroke="#9A3412" stroke-width="2"/>
  <text class="box-label" x="550" y="331">
    <tspan x="550" dy="0">Task-specific</tspan>
    <tspan x="550" dy="27">Deep Learning</tspan>
  </text>

  <rect class="node" x="430" y="420" width="240" height="80" rx="18" fill="#7C3AED" stroke="#4C1D95" stroke-width="2"/>
  <text class="box-label" x="550" y="451">
    <tspan x="550" dy="0">Vision-language</tspan>
    <tspan x="550" dy="27">models (VLMs)</tspan>
  </text>

  <!-- Prediction nodes -->
  <rect class="node" x="910" y="140" width="260" height="90" rx="18" fill="#0E7490" stroke="#164E63" stroke-width="2"/>
  <text class="box-label" x="1040" y="176">
    <tspan x="1040" dy="0">Lymph node metastasis</tspan>
    <tspan x="1040" dy="27">prediction</tspan>
  </text>

  <rect class="node" x="910" y="340" width="260" height="90" rx="18" fill="#C2415A" stroke="#881337" stroke-width="2"/>
  <text class="box-label" x="1040" y="376">
    <tspan x="1040" dy="0">Invasion depth</tspan>
    <tspan x="1040" dy="27">prediction</tspan>
  </text>
</svg>
